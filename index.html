<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Profiles</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f5f6f8; color: #111; }
      @media (prefers-color-scheme: dark) { body { background: #0c0e11; color: #eee; } a { background: #1a1d22 !important; } }
      main { display: grid; gap: 12px; padding: 16px; width: min(420px, 100%); box-sizing: border-box; }
      a { display: block; padding: 18px 20px; border-radius: 10px; background: #fff; color: inherit; text-decoration: none; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      a span { display: block; font-weight: 400; opacity: .65; font-size: 14px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <main>
      <a href="/gema/">PT. Gema Fast Solutions<span>/gema</span></a>
      <a href="/vista/">Vista Artha Mandiri<span>/vista</span></a>
    </main>
  </body>
</html>
