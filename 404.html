<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages only serves the root 404.html; route unknown paths back into the right app.
      var p = location.pathname.toLowerCase();
      var target = p.indexOf('/gema') === 0 ? '/gema/' : p.indexOf('/vista') === 0 ? '/vista/' : '/';
      location.replace(target + location.hash);
    </script>
  </head>
  <body></body>
</html>
